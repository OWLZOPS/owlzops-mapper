name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

jobs:
  test-native:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Disable Clang to force GCC for aws-lc-sys
        if: matrix.os == 'ubuntu-22.04'
        run: sudo rm -rf /usr/bin/clang* /usr/local/bin/clang* /usr/lib/llvm* || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # action HEAD as of 2026-06-28
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          prefix-key: "v4-gcc-force"
          shared-key: ${{ matrix.os }}   # isolate cache per OS to avoid glibc mismatch

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # R19-16: guard panic=unwind invariant (one-shot, not matrix-duplicated)
      - name: Guard panic strategy (R19-16)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          grep -qE '^\s*panic\s*=\s*"unwind"' Cargo.toml \
            || { echo "::error file=Cargo.toml::panic=\"unwind\" missing from [profile.release]"; exit 1; }
          if grep -qE 'panic\s*=\s*"abort"' Cargo.toml; then
            echo "::error file=Cargo.toml::panic=\"abort\" reintroduced — scanner isolation depends on JoinError::is_panic(); see v0.5.4 revert"
            exit 1
          fi

      - name: Install ripgrep
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # R26-02/17/29/31/33/36/40/43/44/48: capped-I/O doctrine.
      - name: Guard capped-I/O doctrine
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -uo pipefail
          fail=0

          # Old generic names must not exist: read_procfs_* asserts a pseudo-fs
          # path, read_file_capped_regular asserts a host-controlled one.
          if rg -n 'read_file_(bytes_)?capped\(' src/ | rg -v '^src/safe_io\.rs:' ; then
            echo "::error::renamed API — use read_procfs_capped for /proc,/sys or read_file_capped_regular for host paths"
            fail=1
          fi

          # R26-48(b): `rg -P` exits non-zero when the build lacks PCRE2, which
          # inside `if` reads as "no matches" — the guard would silently stop
          # running while the step stays green. Fail loudly instead.
          if ! printf 'x\n' | rg -qP 'x' 2>/dev/null ; then
            echo "::error::ripgrep in this image has no PCRE2 (-P); the literal-path guard cannot run"
            fail=1
          fi

          # R26-43: a procfs reader given a LITERAL path that is not a kernel
          # pseudo-file. Variable paths stay author-asserted; literals are
          # exactly how R26-02 happened. -U: rustfmt breaks long literal args
          # onto the next line — the shape provenance.rs had before R26-38.
          if rg -U -n -P 'read_procfs_(bytes_)?capped\(\s*"(?!/proc/|/sys/)' src/ \
               | rg -v '^src/safe_io\.rs:' ; then
            echo "::error::read_procfs_* on literal non-pseudo-fs path — use read_file_capped_regular"
            fail=1
          fi

          # Raw blocking opens outside safe_io. Streaming call sites use
          # safe_io::open_regular_streaming; genuine exceptions carry an inline
          # `// CAPPED_IO_OK: <why>` (R26-40). `/dev` is NOT exempt (R26-44).
          if rg -n 'fs::read_to_string\(|File::open\(' src/ \
               | rg -v '^src/safe_io\.rs:' \
               | rg -v '/proc|/sys|CAPPED_IO_OK' ; then
            echo "::error::uncapped blocking open — use read_file_capped_regular/open_regular_streaming, or annotate CAPPED_IO_OK"
            fail=1
          fi

          # Every sanitizer backs onto the shared predicate (R25-65/R26-07).
          for f in $(rg -l 'fn sanitize_' src/); do
            rg -q 'is_terminal_unsafe|sanitize_for_document' "$f" \
              || { echo "::error file=$f::sanitizer does not use the shared predicate"; fail=1; }
          done

          # No fork of `which` (R26-04).
          if rg -n '"which"' src/ ; then
            echo "::error::use resolve_tool, not a fork of which"
            fail=1
          fi

          exit $fail

      # R28-01: remote-path code must not write to the process-wide coverage sink.
      - name: Guard coverage-sink doctrine (R28-01)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -uo pipefail
          for f in src/ssh_engine.rs src/known_hosts.rs ; do
            test -f "$f" || { echo "::error::R28-01 guard target $f is missing — guard is blind"; exit 1; }
          done
          # Positive self-test: the pattern must match the literal it forbids.
          printf 'crate::coverage::record(format!(\n' \
            | rg -q 'coverage::record\(' \
            || { echo "::error::R28-01 guard pattern does not match — guard is blind"; exit 1; }
          if rg -n 'coverage::record\(' src/ssh_engine.rs src/known_hosts.rs ; then
            echo "::error::remote-path coverage::record — use RemoteCoverage::notes (R28-01)"
            exit 1
          fi

      # R28-04: every Deserialize struct in models.rs carries container-level
      # #[serde(default)], so adding a field can never make historical snapshots
      # unreadable — R26-05 turns that into a refusal to diff the whole file.
      - name: Guard serde container default (R28-04)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 - <<'PY'
          import re, sys
          src = open("src/models.rs").read()
          bad = []
          inspected = 0
          # R28-09: `#\[[^\n]*\]` requires a single-line attribute. rustfmt wraps
          # long derives, and a wrapped derive would make this match nothing —
          # the guard would go green having inspected zero structs (cf. R26-43).
          for m in re.finditer(r'((?:[ \t]*#\[[^\]]*\]\s*)+)(?:pub[ \t]+)?struct[ \t]+(\w+)', src):
              attrs, name = m.group(1), m.group(2)
              if 'Deserialize' not in attrs:
                  continue
              inspected += 1
              if not re.search(r'#\[serde\([^)]*\bdefault\b', attrs):
                  bad.append(name)
          MIN_STRUCTS = 40  # set from the current count; see command below
          if inspected < MIN_STRUCTS:
              print(f"::error file=src/models.rs::R28-04 guard inspected only {inspected} "
                    f"Deserialize structs (expected >= {MIN_STRUCTS}) — the pattern is stale")
              sys.exit(1)
          if bad:
              print("::error file=src/models.rs::structs without container-level #[serde(default)] (R28-04): " + ", ".join(bad))
              sys.exit(1)
          PY

      # R28-05: JSONL key set is a schema contract — it must not depend on values.
      # Applies to ALL serializable structs across the codebase, not just models.rs.
      # R28-13: gate scope broadened from models.rs to all of src/.
      - name: Guard JSONL key stability (R28-05)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -uo pipefail
          PAT='^\s*#\[serde\([^\]]*skip_serializing_if'
          # R28-09: positive self-test. A pattern rg cannot compile exits 2,
          # which `if` reads as "no matches" — the guard would stay green while
          # checking nothing. Exactly the R26-48(b) failure mode.
          printf '    #[serde(default, skip_serializing_if = "Option::is_none")]\n' \
            | rg -q "$PAT" \
            || { echo "::error::R28-05 guard pattern does not match a known-bad line — guard is blind"; exit 1; }
          if rg -n "$PAT" src/ ; then
            echo "::error file=src/::skip_serializing_if attribute breaks JSONL key stability (R28-05)"
            exit 1
          fi

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  check-commit-refs:
    name: Check remediation references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # R25-70: need the PR merge-base, not just HEAD~1.
          fetch-depth: 0

      - name: Check commit references against diff
        env:
          # Empty outside pull_request; the script falls back to HEAD~1.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check_commit_refs.sh

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check env var manipulation gate
        run: bash .github/scripts/check_env_var_gate.sh

      - name: Doctrine gates (R27-14 / R27-17 / R27-18)
        run: bash .github/scripts/check_doctrine_gates.sh

  build-macos-orchestrator:
    name: Build macOS orchestrator
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # action HEAD as of 2026-06-28
        with:
          toolchain: stable
          components: clippy   # R19V11‑01: re‑enable after dead‑code cleanup

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Run tests (orchestrator config)
        run: cargo test --locked --no-default-features

      - name: Clippy (orchestrator config)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build orchestrator (remote-only)
        run: cargo build --release --no-default-features

  test-containers:
    name: Test in ${{ matrix.container }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:stable
          - almalinux:8
          - almalinux:9
          - redhat/ubi8:latest
          - redhat/ubi9:latest
          - fedora:latest
          - rockylinux:8
          - rockylinux:9
          - quay.io/centos/centos:stream9
          - alpine:latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (build-only)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y curl gcc make
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing curl gcc make || {
              dnf install -y gcc make
              dnf install -y --allowerasing curl
            }
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y gcc make curl
            update-ca-trust
          elif command -v yum >/dev/null 2>&1; then
            yum install -y curl gcc make
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl gcc musl-dev make tar gzip
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ${{ matrix.container }}

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

  test-opensuse:
    name: Test in openSUSE Tumbleweed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests in openSUSE container
        run: |
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            opensuse/tumbleweed:latest \
            bash -c "
            set -ex
            zypper --non-interactive refresh
            zypper --non-interactive install -y gcc gcc-c++ make curl glibc-devel tar gzip
            export CC=gcc
            export CXX=g++
            export RUSTFLAGS='-C linker=gcc'
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source \$HOME/.cargo/env
            cargo build --locked
            cargo test --locked
          "