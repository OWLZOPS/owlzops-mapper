name: Release

on:
  push:
    tags:
      - 'v*'

# R27-03: least privilege at workflow level
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: owlzops-mapper-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: owlzops-mapper-linux-arm64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: owlzops-mapper-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # action HEAD as of 2026-06-28
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      # R27-02: tags do not trigger CI; verify the released commit matches Cargo.toml
      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${{ github.ref_name }}"
          CRATE="v$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d'"' -f2)"
          [ "$TAG" = "$CRATE" ] || {
            echo "::error file=Cargo.toml::tag $TAG does not match crate version $CRATE — \
                  reports would carry the wrong version in meta.binary_version"
            exit 1
          }

      - name: Install musl tools (Linux only)
        if: matrix.target != 'aarch64-apple-darwin'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test the exact commit being released
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            cargo build --release --target ${{ matrix.target }} --no-default-features
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} owlzops-mapper
          cd ../../..
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # action HEAD as of 2026-06-28
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # Release 2.85.10
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-artifact
          path: sbom.json

  sign:
    name: Sign artifacts
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # R27-07: take the first public key only
          echo "trusted-key $(gpg --list-keys --with-colons | grep '^pub' | cut -d: -f5 | head -1)" >> ~/.gnupg/gpg.conf
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign all artifacts (archives, checksums, SBOM)
        run: |
          for file in *.tar.gz *.sha256 sbom.json; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$file"
          done
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # R27-05: verify signatures before publishing
      - name: Verify every signature before publishing
        run: |
          set -e
          n=0
          for sig in *.asc; do
            gpg --batch --verify "$sig" "${sig%.asc}"
            n=$((n+1))
          done
          [ "$n" -ge 7 ] || { echo "::error::only $n signatures produced, expected >= 7"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-artifacts
          path: |
            *.tar.gz
            *.sha256
            *.asc
            sbom.json
            sbom.json.asc

  release:
    name: Create GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # Release 2.85.10
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      # Repository CHANGELOG.md: full history with version headings (R27-01).
      - name: Regenerate full changelog
        run: git-cliff -o CHANGELOG.md

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            *.tar.gz
            *.sha256
            *.asc
            sbom.json
            sbom.json.asc
          draft: false
          # SemVer: anything after '-' is a pre-release (R27-06).
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Create Pull Request for changelog update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="changelog/${{ github.ref_name }}-${{ github.run_id }}"
          rm -f RELEASE_NOTES.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin $BRANCH_NAME
          gh pr create \
            --base main \
            --head $BRANCH_NAME \
            --title "docs: update CHANGELOG for ${{ github.ref_name }}" \
            --body "Automated changelog update after release ${{ github.ref_name }}. This PR was generated by the Release workflow (Run ID: ${{ github.run_id }})." \
            || echo "PR already exists or creation failed (non‑critical)"