# git-cliff configuration for owlzops-mapper
[changelog]
header = "# Changelog\n"
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = """
{% if github.release %}
**Full Changelog:** {{ github.release_url }}
{% endif %}
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    # R26-47: changelog maintenance commits must not appear in the changelog.
    { message = '(?i)^(docs?|documentation)(\(changelog\))?:.*CHANGELOG', skip = true },
    { message = '^chore\(release\)', skip = true },
    { message = '^chore: [Bb]ump version', skip = true },
    { message = '^chore: [Rr]elease', skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance Improvements" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build System" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverts" },
]